name: fetch-tw-futures
# 使用者同意（2026-11-22）：雲端工作階段連不到 FinMind，改由 GitHub Actions 抓期貨/選擇權未平倉並 commit 回分支；用完即刪
on:
  push:
    branches: [claude/project-thread-9qyvrx]
    paths: [.github/workflows/fetch-data.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas numpy requests
      - run: python tw-model/fetch_local.py --futures
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-model/data/ext
          git commit -m "Add TX futures / TXO option open interest (FinMind) via Actions" || echo "nothing to commit"
          git push
