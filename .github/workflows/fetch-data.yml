name: fetch-taifex-pcratio
# 使用者同意（2026-11-24「同意 改用期交所資料重跑」）：抓期交所官方台指選擇權 P/C Ratio（2016 起），commit 回分支；用完即刪
on:
  push:
    branches: [claude/project-thread-3uzznz]
    paths: [.github/workflows/fetch-data.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas requests lxml
      - run: python tw-model/fetch_taifex_pc.py 2016-01-01
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-model/data
          git commit -m "Add official TAIFEX TXO put/call ratio (2016+) via Actions" || echo "nothing to commit"
          git pull --no-rebase --no-edit origin claude/project-thread-3uzznz || true
          git push
