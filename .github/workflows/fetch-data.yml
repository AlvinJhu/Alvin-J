name: fetch-txo-daily
# 使用者同意（2026-11-22「同意用 Actions 抓選擇權資料」）：雲端工作階段連不到 FinMind，改由 Actions 抓台指選擇權每日買賣權資料並 commit 回分支；用完即刪
on:
  push:
    branches: [claude/project-thread-9qyvrx]
    paths: [.github/workflows/fetch-data.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas numpy requests
      - run: python tw-model/fetch_local.py --optdaily
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-model/data/ext
          git commit -m "Add TXO daily call/put volume and OI aggregates (FinMind/TAIFEX) via Actions" || echo "nothing to commit"
          git pull --no-rebase --no-edit origin claude/project-thread-9qyvrx || true
          git push
