name: fetch-long-index
# 使用者同意（2026-11-22「抓資料 重跑」）：抓 1999 起證交所加權指數與成交金額、yfinance ^TWII（1997 起）與 ^SOX 全期，commit 回分支；用完即刪
on:
  push:
    branches: [claude/project-thread-cw8rrg]
    paths: [.github/workflows/fetch-data.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas numpy requests yfinance
      - run: python tw-model/fetch_local.py --long
      - run: python tw-model/fetch_twse.py monthly 1999-01
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-model/data
          git commit -m "Add 1999+ TAIEX OHLC/turnover (TWSE) and long ^TWII/^SOX history via Actions" || echo "nothing to commit"
          git pull --no-rebase --no-edit origin claude/project-thread-cw8rrg || true
          git push
