name: fetch-tw-data
# 使用者同意（2026-11-21）：雲端工作階段連不到證交所/FinMind/Yahoo，改由 GitHub Actions 抓取並 commit 回分支；用完即刪
on:
  push:
    branches: [claude/project-thread-9qyvrx]
    paths: [.github/workflows/fetch-data.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas numpy requests yfinance
      - run: python tw-model/fetch_local.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tw-model/data/ext
          git commit -m "Add 2016+ chip data (FinMind) and SOX/TNX (yfinance) via Actions" || echo "nothing to commit"
          git push
